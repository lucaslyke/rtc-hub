# shortcut: o volume só é populado na criação; ao trocar o COMMIT, rodar "docker volume rm rtc-hub_tabelas"
services:
  calc-regular:
    build:
      context: engines
      dockerfile: java.Dockerfile
      args:
        REPO: https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git
        COMMIT: 150cccbe414d4a5edea703e4f7a424af5aa222c7
    volumes: [tabelas:/app/calculadora/db]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/swagger-ui.html HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -E \" (200|30.) \"'"]
      interval: 15s
      retries: 10
      start_period: 40s
  calc-simples:
    build:
      context: engines
      dockerfile: java.Dockerfile
      args:
        REPO: https://github.com/ReceitaFederal/calculadora-rtc-simples-nacional.git
        COMMIT: c5b0f01c8351c3f0d0795cc617b29d233e9f98df
    volumes: [tabelas:/app/calculadora/db]
    mem_limit: 768m
    depends_on: [calc-regular]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf \"GET /api/versao HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -E \" (200|30.) \"'"]
      interval: 15s
      retries: 10
      start_period: 40s
volumes:
  tabelas:
