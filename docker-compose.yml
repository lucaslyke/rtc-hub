# shortcut: o volume só é populado na criação; ao trocar o COMMIT, rodar "docker volume rm rtc-hub_tabelas"
services:
  calc-regular:
    build:
      context: engines
      dockerfile: java.Dockerfile
      args:
        REPO: https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git
        COMMIT: 150cccbe414d4a5edea703e4f7a424af5aa222c7
    volumes: [tabelas:/app/calculadora/db]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/swagger-ui.html HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -E \" (200|30.) \"'"]
      interval: 15s
      retries: 10
      start_period: 40s
  calc-simples:
    build:
      context: engines
      dockerfile: java.Dockerfile
      args:
        REPO: https://github.com/ReceitaFederal/calculadora-rtc-simples-nacional.git
        COMMIT: c5b0f01c8351c3f0d0795cc617b29d233e9f98df
    volumes: [tabelas:/app/calculadora/db]
    mem_limit: 768m
    depends_on: [calc-regular]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf \"GET /api/versao HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -E \" (200|30.) \"'"]
      interval: 15s
      retries: 10
      start_period: 40s
  api:
    build: api
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      TABELAS_DB: /tabelas/calculadora-pro.db
      CALC_REGULAR_URL: http://calc-regular:8080
      CALC_SIMPLES_URL: http://calc-simples:8082
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: "8090"
    volumes: [tabelas:/tabelas:ro]
    depends_on:
      calc-regular: {condition: service_healthy}
      calc-simples: {condition: service_healthy}
  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on: [api]
volumes:
  tabelas:
